name: Skill behavior issue
description: A reproducible case where a skill made an unsuitable decision
title: "[behavior] "
body:
  - type: textarea
    id: prompt
    attributes:
      label: Original task and materials
      description: Remove personal data and secrets. A minimal example is enough.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Skill version, agent, and model
      description: Commit SHA or workflow revision; say when a value is unknown.
  - type: textarea
    id: observed
    attributes:
      label: What happened
      description: An artifact, screenshot, or short response excerpt. Separate observations from assumptions about the cause.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What result did you expect?
    validations:
      required: true
